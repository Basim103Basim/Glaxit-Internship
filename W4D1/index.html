<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="main">
        <div class="box">
            <h1 class="digits" id="hours-digit"></h1>
        </div>
        <h1 class="colon">:</h1>
        <div class="box">
            <h1 class="digits" id="minutes-digit"></h1>
        </div>
        <h1 class="colon">:</h1>
        <div class="box">
            <h1 class="digits" id="seconds-digit"></h1>
        </div>
    </div>
    <div id="buttons">
        <button id="startStop">Start</button>
        <button id="reset">Reset</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
